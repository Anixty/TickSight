name: Build TickSight
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
            25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test the upload protocol locally
        run: ./gradlew -p upload-test check --console=plain
      - name: Build all Minecraft and loader variants
        run: ./gradlew collectJars --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ticksight-${{github.sha}}
          path: build/libs/*.jar
          if-no-files-found: error
