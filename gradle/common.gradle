apply from: rootProject.file('gradle/base.gradle')
base { archivesName = "${rootProject.archives_base_name}-common" }
architectury {
    common(mcVersion == '1.20.1' ? ['fabric', 'forge'] : ['fabric', 'neoforge'])
}
dependencies {
    compileOnly project(':call-trace-agent')
    if (noRemap) {
        implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
        implementation("dev.architectury:architectury:${architectury_version}")
    } else {
        modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
        modApi("dev.architectury:architectury:${architectury_version}")
    }
}
processResources {
    inputs.property('resourcePackFormat', resource_pack_format)
    doLast {
        def format = Integer.parseInt(resource_pack_format.toString())
        def pack = [description: 'TickSight profiling overlays', pack_format: format]
        if (noRemap) {
            pack.min_format = [format, 0]
            pack.max_format = [format, 0]
        }
        new File(destinationDir, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson([pack: pack])
    }
}
